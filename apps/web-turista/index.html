<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <!-- Viewport adaptativo para soportar Safe Areas, muescas (Notch) y pantallas curvas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <title>COTATUR • Encuesta Turística Oficial del Táchira</title>

    <!-- Tailwind CSS para diseño ágil y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos específicos de geometría y adaptabilidad móvil -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="min-h-full flex flex-col text-slate-800 bg-slate-100 antialiased font-sans">

    <!-- 1. Encabezado Institucional y Punto QR -->
    <div id="header-mount"></div>

    <!-- 2. Contenedor Principal del Formulario Web -->
    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-4 space-y-4 px-safe pb-safe">
        <form id="form-encuesta-turistica" class="space-y-4">
            
            <!-- Sección 1: Procedencia -->
            <div id="step-1-mount"></div>

            <!-- Sección 2: Destino en Táchira y Motivo de Viaje -->
            <div id="step-2-mount"></div>

            <!-- Sección 3: Calificación de Servicios -->
            <div id="step-3-mount"></div>

            <!-- Protección Turnstile (Insignia Informativa Silenciosa) -->
            <div class="flex items-center justify-center space-x-2 text-[11px] text-slate-500 py-1">
                <svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"/>
                </svg>
                <span>Conexión cifrada y protegida por <b>Cloudflare Turnstile</b></span>
            </div>

            <!-- Botón de Envío y Obtención de Recompensa -->
            <div class="pt-1">
                <button type="submit" id="btn-submit-encuesta"
                    class="w-full py-4 px-6 bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-950 hover:from-blue-950 hover:to-indigo-950 text-white font-black text-sm uppercase tracking-wider rounded-2xl shadow-xl shadow-blue-950/20 active:scale-98 transition-all flex items-center justify-center space-x-2">
                    <span>Enviar Encuesta y Obtener Guía PDF</span>
                    <span class="text-amber-400">🎁</span>
                </button>
            </div>

        </form>

        <!-- Pie de página institucional de ley -->
        <footer class="text-center text-xs text-slate-600 py-4 space-y-1">
            <p class="font-bold text-slate-700">Corporación Tachirense de Turismo (COTATUR)</p>
            <p>Gobernación del Estado Táchira • UNEFA Pasantía Britney</p>
            <p class="text-[10px] text-slate-500">Datos anónimos y estadísticos protegidos por la Ley de Infogobierno</p>
        </footer>
    </main>

    <!-- 3. Modal de Recompensa Instantánea (Mapa + Directorio de Emergencias) -->
    <div id="modal-mount"></div>

    <!-- 4. Lógica de inicialización modular -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
