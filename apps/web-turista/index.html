<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>COTATUR - Encuesta de Perfil del Visitante</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos base -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="min-h-full flex flex-col text-gray-900 bg-gray-100 antialiased font-sans">

    <!-- 1. Encabezado Institucional -->
    <div id="header-mount"></div>

    <!-- 2. Cuerpo del Formulario -->
    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-5 space-y-4 px-safe pb-safe">
        <form id="form-encuesta-turistica" class="space-y-4">
            
            <!-- Sección I: Procedencia -->
            <div id="step-1-mount"></div>

            <!-- Sección II: Destino y Estadía -->
            <div id="step-2-mount"></div>

            <!-- Sección III: Evaluación de Servicios -->
            <div id="step-3-mount"></div>

            <!-- Botón de Envío -->
            <div class="pt-2">
                <button type="submit" id="btn-submit-encuesta"
                    class="w-full py-3 px-5 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm rounded shadow-sm transition-colors">
                    Registrar encuesta
                </button>
            </div>

        </form>

        <!-- Pie de página sobrio -->
        <footer class="text-center text-[11px] text-gray-500 py-4 border-t border-gray-200 mt-6">
            <p class="font-medium text-gray-600">Corporación Tachirense de Turismo (COTATUR)</p>
            <p class="mt-0.5">Registro estadístico de carácter anónimo.</p>
        </footer>
    </main>

    <!-- 3. Cuadro de Confirmación -->
    <div id="modal-mount"></div>

    <!-- 4. Inicialización -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
