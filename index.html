<!DOCTYPE html>
<html lang="es" class="h-full" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1c1c1c">
    <title>COTATUR • Encuesta Oficial de Perfil del Visitante</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <!-- Estilos base, compatibilidad de pantallas y temas (Claro / Oscuro LCD / AMOLED) -->
    <link rel="stylesheet" href="./apps/web-turista/css/styles.css">
</head>
<body class="min-h-full flex flex-col antialiased font-['Poppins',sans-serif]">

    <!-- 1. Encabezado Institucional con Logos Oficiales y Selector de Tema -->
    <div id="header-mount"></div>

    <!-- 2. Cuerpo del Formulario de Encuesta Turística -->
    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-5 space-y-4 px-safe pb-safe">
        <form id="form-encuesta-turistica" class="space-y-4">
            
            <!-- Sección I: Procedencia -->
            <div id="step-1-mount"></div>

            <!-- Sección II: Destino y Estadía -->
            <div id="step-2-mount"></div>

            <!-- Sección III: Operativo / Temporada Activa -->
            <div id="step-temporada-mount"></div>

            <!-- Sección IV: Evaluación de Servicios -->
            <div id="step-3-mount"></div>

            <!-- Botón de Envío -->
            <div class="pt-2">
                <button type="submit" id="btn-submit-encuesta"
                    class="w-full py-3.5 px-5 bg-[#1c1c1c] hover:bg-black text-amber-400 font-bold text-sm uppercase tracking-wide rounded-xl shadow-md border border-amber-500/30 transition-all active:scale-98">
                    Registrar encuesta y descargar guía
                </button>
            </div>

        </form>

        <!-- Pie de página oficial de COTATUR -->
        <footer class="text-center text-[11px] py-4 border-t border-gray-300/40 mt-6 space-y-1">
            <p class="font-bold text-gray-700 dark:text-gray-300">Corporación Tachirense de Turismo (COTATUR)</p>
            <p class="text-[10px] text-gray-500">
                Av. España cruce con Av. Carabobo, Edif. COTATUR. San Cristóbal, Edo. Táchira.<br/>
                Teléfono: 0424-7388849 • cotatur@tachiraesturismo.com
            </p>
            <p class="text-[9px] text-gray-400 mt-1">Registro estadístico anónimo conforme al Art. 28 de la CRBV</p>
        </footer>
    </main>

    <!-- 3. Modal de Recompensa al Turista (Guía y Contactos de Emergencia) -->
    <div id="modal-mount"></div>

    <!-- 4. Inicialización Modular -->
    <script type="module" src="./apps/web-turista/js/app.js"></script>
</body>
</html>
